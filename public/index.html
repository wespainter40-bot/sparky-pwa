<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sparky</title>
  <meta name="theme-color" content="#07090a">
  <meta name="description" content="Sparky, a friendly energy-core chat assistant">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="/style.css">
</head>
<body data-state="ready">
  <canvas id="dust" aria-hidden="true"></canvas>
  <div class="app">
    <header class="top">
      <div class="brand">
        <span class="logo" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M13.2 2.5 5 13.5h5.6l-1 8 8.4-11.3h-5.7l.9-7.7z"/></svg>
        </span>
        <h1>Sparky</h1>
        <p id="status" class="pill" role="status" aria-live="polite"><i class="dot" aria-hidden="true"></i><span id="statusText">Ready</span></p>
      </div>
      <div class="actions">
        <button id="muteBtn" class="icon-btn" aria-label="Mute Sparky's voice" aria-pressed="false">
          <svg class="on" viewBox="0 0 24 24"><path d="M4 9.5v5h3.5l4.5 3.8V5.7L7.5 9.5H4z"/><path d="M15.7 9a4.2 4.2 0 0 1 0 6M18.4 6.4a8 8 0 0 1 0 11.2"/></svg>
          <svg class="off" viewBox="0 0 24 24"><path d="M4 9.5v5h3.5l4.5 3.8V5.7L7.5 9.5H4z"/><path d="M16.5 9.5l5 5M21.5 9.5l-5 5"/></svg>
        </button>
        <button id="exportBtn" class="icon-btn" aria-label="Save or export chats">
          <svg viewBox="0 0 24 24"><path d="M12 4v10.5m0 0L7.8 10.3M12 14.5l4.2-4.2M5 19.5h14"/></svg>
        </button>
      </div>
    </header>

    <main>
      <section id="above" class="cards above" aria-label="Sparky's messages"></section>

      <section class="stage" id="stage">
        <canvas id="back" aria-hidden="true"></canvas>
        <canvas id="plasma" aria-hidden="true"></canvas>
        <canvas id="core" aria-hidden="true"></canvas>
        <button id="coreBtn" class="core-hit" aria-label="Tap the glowing core to talk to Sparky"></button>
        <p id="hint" class="hint">Tap the glow to talk</p>
      </section>

      <section id="below" class="cards below" aria-label="Your messages"></section>
    </main>

    <form id="form" class="composer" autocomplete="off">
      <button id="micBtn" type="button" class="mic" aria-label="Talk to Sparky" aria-pressed="false">
        <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3"/></svg>
      </button>
      <input id="input" type="text" maxlength="500" placeholder="Or type to Sparky..." enterkeyhint="send" aria-label="Type a message">
      <button id="send" type="submit" class="send" aria-label="Send">
        <svg viewBox="0 0 24 24"><path d="M21.5 3 10.8 13.7M21.5 3l-6.8 18.5-3.9-7.8-7.8-3.9L21.5 3z"/></svg>
      </button>
    </form>
  </div>

  <dialog id="exportDlg" class="dlg">
    <h2>Save chats</h2>
    <p class="dlg-note">Chats are saved on the Sparky server as Markdown (works great in Obsidian).</p>
    <div class="dlg-btns">
      <button id="dlThis" class="btn">Download this chat (.md)</button>
      <button id="dlAll" class="btn">Download all chats (.zip)</button>
      <button id="syncDrive" class="btn" hidden>Sync to Google Drive</button>
      <button id="newChat" class="btn ghost">Start a new chat</button>
    </div>
    <p id="dlgMsg" class="dlg-note" role="status"></p>
    <button id="dlgClose" class="btn ghost">Close</button>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
